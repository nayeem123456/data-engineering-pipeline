lakehouse_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'lakehouse_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'lakehouse_secure_pass_2026') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'lakehouse_dw') }}"
      schema: gold
      threads: 4
      keepalives_idle: 0
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'lakehouse_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'lakehouse_secure_pass_2026') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'lakehouse_dw') }}"
      schema: gold
      threads: 8
